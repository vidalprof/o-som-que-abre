<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>O Som que Abre — 1º ano</title>
<meta name="description" content="Dez folhas interativas de rima para o 1º ano: julgar se rima, achar a que rima, pintar, a pegadinha, circular, arrastar, ligar, completar a parlenda, escrever e montar o mural.">
<!-- ============================================================
     O BANDO DAS RIMAS — alfabetizacao, 1o ano (consciencia fonologica)
     LIVRO DE FOLHAS INTERATIVAS, 10 folhas.

     ⭐ NASCEU DO METODO NOVO (Marcos, set/2026): *"criar sequencias didaticas
     de alfabetizacao com essas atividades da internet, dando a interatividade
     que elas pedem"* e *"pode ser em folhas soltas; com elas sera montada a
     sequencia didatica — o pedagogo consegue"*.

     ENTAO CADA FOLHA DAQUI VEIO DE UMA FOLHA REAL DE PROFESSOR, e e FIEL a ela:
     as mesmas palavras, os mesmos distratores, o mesmo comando impresso. As
     folhas estao em `_sequencias/folhas/` (d06, d08, d17, d18, d24) e os itens
     em `_sequencias/POTE-RIMA.md`, com cada correcao justificada.
     O que muda e so o GESTO — a folha foi feita para o papel, e transpor direto
     daria "papel na tela", que e pior que papel.

     ⭐ POR QUE RIMA, E POR QUE ELA VEM PRIMEIRO. O parecer pedagogico da Fabrica
     de Palavras achou este buraco: o objetivo F do curriculo de Blumenau para o
     1o ano — *"recitar parlendas, quadras, quadrinhas, trava-linguas...
     observando as RIMAS"* — nao estava em folha nenhuma. E na consciencia
     fonologica a rima e o degrau ANTERIOR a silaba: unidade grande antes da
     pequena. Ela e a porta de entrada, e faltava.

     A ESCADA (da mais facil para a mais dificil, nao a ordem das folhas):
       1 julgar se rima  →  2 achar entre tres  →  3 pintar a palavra escrita
       →  4 a PEGADINHA (comeca igual, nao rima)  →  5 circular as duas
       →  6 arrastar  →  7 ligar  →  8 completar a parlenda (objetivo F puro)
       →  9 escrever  →  10 montar o proprio mural.

     ARTE: 56 figuras — 37 RECORTADAS das proprias folhas de professor (prefixo
     `al2_` no banco) e 19 REAPROVEITADAS do banco. Nenhuma imagem gerada.
     ES5 puro, um arquivo, sem biblioteca. NAO usa o motor (folha viva).
     ============================================================ -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
:root{
  /* ⚠️ OS TOKENS DE COR DA FOLHA VIVA (set/2026). Estes cadernos nasceram sem
     eles e o portão `_qa/cor_fixa.py` reprovava nove regras em cada um: cor de
     texto cravada, sem fundo próprio, que num tema diferente vira letra invisível.
     O motor já tinha `--texto`; a folha viva não. Agora tem, e a peça segue o
     tema em vez de apostar num. */
  --texto:#1e2334;        /* o preto do texto corrido */
  --texto2:#2c3350;       /* o preto dos rótulos de figura */
  --texto3:#3b4064;       /* o preto mais claro das letras grandes */
}
body{font-family:"Segoe UI",Arial,sans-serif;background:#eef1f7;color:var(--texto);padding-bottom:160px}
#topo{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid #6d5ae6;
  box-shadow:0 2px 14px rgba(40,30,90,.13);padding:8px 10px;display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
#topo .tit{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:12px;background:#e6e6f4;border-radius:8px;overflow:hidden;flex:1;min-width:60px;max-width:200px}
.prog i{display:block;height:100%;width:0;background:#6d5ae6;border-radius:8px;-webkit-transition:width .5s;transition:width .5s}
.pg{font-weight:800;font-size:14px;color:#5b4fc4;white-space:nowrap}
button{font-family:inherit;cursor:pointer}
.bt{min-width:48px;min-height:48px;border:0;border-radius:16px;background:#6d5ae6;color:#fff;font-weight:800;font-size:17px;
  padding:10px 18px;box-shadow:0 4px 0 #4c3cbb;-webkit-transition:transform .08s;transition:transform .08s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 #4c3cbb}
.bt[disabled]{opacity:.45;cursor:default;box-shadow:none}
.bt.cinza{background:#e4e6f2;color:#4a4f66;box-shadow:0 4px 0 #c3c7dc}
.bt.verde{background:#15a34a;box-shadow:0 4px 0 #0d7736}
.zap{width:42px;height:42px;border-radius:50%;border:0;background:#6d5ae6;box-shadow:0 3px 0 #4c3cbb;
  display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.zap svg{width:22px;height:22px;fill:#fff}
.zap.off{background:#b9bcd0;box-shadow:0 3px 0 #9599b3}
.zap.ouvir{background:#fff;box-shadow:0 3px 0 #cdd0e4;border:2px solid #6d5ae6}
.zap.ouvir svg{fill:#6d5ae6}
.zap.ouvir.tocando{-webkit-animation:pulsa 1s infinite;animation:pulsa 1s infinite}
@-webkit-keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

#livro{max-width:880px;margin:12px auto 0;padding:0 10px}
.pagina{position:relative;background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(35,25,80,.16);display:none;overflow:hidden;padding:0 0 20px}
.pagina.viva{display:block;-webkit-animation:entra .35s ease-out;animation:entra .35s ease-out}
@-webkit-keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.faixa{background:#6d5ae6;color:#fff;padding:15px 18px 13px;display:flex;align-items:center;gap:12px}
.faixa h2{margin:0;font-size:clamp(17px,4.4vw,25px);letter-spacing:.4px;text-transform:uppercase;flex:1;line-height:1.1}
.faixa .num{background:#fff;color:#6d5ae6;font-weight:900;border-radius:50%;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;font-size:18px;flex:none}
.pagina.c1 .faixa{background:#e0562f}.pagina.c1 .faixa .num{color:#e0562f}
.pagina.c2 .faixa{background:#1179bf}.pagina.c2 .faixa .num{color:#1179bf}
.pagina.c3 .faixa{background:#15a34a}.pagina.c3 .faixa .num{color:#15a34a}
.pagina.c4 .faixa{background:#b0308f}.pagina.c4 .faixa .num{color:#b0308f}
.pagina.c5 .faixa{background:#c98a06}.pagina.c5 .faixa .num{color:#c98a06}
.enun{margin:14px 16px 4px;font-size:clamp(15px,3.9vw,19px);font-weight:700;line-height:1.35}
.enun b{color:#6d5ae6}

/* =========================================================================
   AS PEÇAS DO BANDO DAS RIMAS
   ⚠️ Cada classe daqui nasceu de uma folha impressa. O leiaute copia o que o
   papel faz — figura-chave grande de um lado, opções do outro — porque é assim
   que a criança já viu a folha na mão do professor.
   ⚠️ E TUDO O QUE SE TOCA TEM 44 px NO MÍNIMO (regra do 1º e 2º ano). Dedo de
   seis anos não acerta alvo pequeno, e alvo pequeno vira erro que não é erro.
   ========================================================================= */

/* folha 1 — as duas palavras lado a lado, com o "e" no meio */
.parrima{display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,26px);
  flex-wrap:nowrap;margin:6px 0 12px}
.parrima .eou{font-weight:800;color:#6d5ae6;font-size:clamp(15px,4vw,20px);flex:none}
.figsom{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.figsom .fig{height:clamp(70px,17vw,104px)}
.figsom .rot{font-weight:800;color:var(--texto2);font-size:clamp(13px,3.4vw,16px);letter-spacing:.5px}

/* a chamada da folha: "PASSARINHO rima com:" */
.chamrima{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px}
.chamrima .figgrande{display:block;width:auto;height:clamp(84px,21vw,128px);max-width:100%;
  margin:0 auto;object-fit:contain}
.chamlin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.chamlin b{font-size:clamp(15px,4vw,19px);color:var(--texto2);letter-spacing:.5px}

/* as opções COM figura (folhas 2, 4 e 6) */
.op.figbt{display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:96px;min-height:112px;padding:8px 10px}
.op.figbt .figop{display:block;width:auto;height:clamp(56px,14vw,80px);max-width:100%;object-fit:contain}
.rotop{font-weight:800;font-size:clamp(11px,2.9vw,13px);color:var(--texto2);letter-spacing:.4px;
  line-height:1.1;word-break:break-word}

/* as opções em PALAVRA, que a folha 08 imprime — e que se PINTAM */
.op.pintavel{min-width:132px;min-height:52px;font-size:clamp(14px,3.6vw,17px);font-weight:800;
  letter-spacing:.6px}

/* folha 5 — a grade que se circula */
.gradecirc{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin:8px 0 4px;touch-action:none}
@media (max-width:430px){.gradecirc{grid-template-columns:repeat(2,1fr)}}
.figcirc{display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:104px;padding:8px 4px;border:3px solid #e4e7f6;border-radius:16px;background:#fff;
  cursor:pointer;-webkit-transition:border-color .18s,background .18s;transition:border-color .18s,background .18s}
.figcirc .figop{display:block;width:auto;height:clamp(50px,13vw,72px);max-width:100%;object-fit:contain}
.figcirc.marcada{border-color:#f59e0b;background:#fff7e6}

/* folha 6 — o alvo para onde a peça é puxada */
.alvorima{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:10px;
  padding:10px;border:3px dashed #c9cdec;border-radius:20px;background:#fff}
.alvorima.alvo{border-color:#6d5ae6;background:#f2efff}
.alvorima .figgrande{display:block;width:auto;height:clamp(80px,20vw,120px);max-width:100%;object-fit:contain}

/* folha 8 — a parlenda e a lacuna que se preenche */
.parlenda{font-size:clamp(16px,4.2vw,21px);font-weight:700;color:var(--texto2);line-height:1.5;
  text-align:center;margin:4px 6px 8px}
.lacuna{display:inline-block;min-width:74px;padding:1px 10px;border-bottom:4px solid #6d5ae6;
  color:#6d5ae6;font-weight:900;text-align:center}
.lacuna.cheia{border-bottom-color:#1f9d55;color:#1f9d55;background:#eafaf0;border-radius:8px 8px 0 0}

/* folha 9 — a caixa de escrever é LARGA (palavra inteira, não sílaba) */
.sq.larga{min-width:168px;padding:0 12px}

/* folha 10 — o mural que a criança monta, e que vai para o relatório */
.mural{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 10px}
.cartaorima{display:flex;align-items:center;gap:4px;min-height:96px;padding:10px 12px;
  border:3px solid #d9ddf2;border-radius:20px;background:#fff;cursor:pointer;
  -webkit-transition:transform .18s,border-color .18s,background .18s;
  transition:transform .18s,border-color .18s,background .18s}
.cartaorima .figop{display:block;width:auto;height:clamp(48px,12vw,66px);max-width:100%;object-fit:contain}
.cartaorima .mais{font-weight:900;color:#6d5ae6;font-size:18px;padding:0 2px}
.cartaorima.escolhido{border-color:#1f9d55;background:#eafaf0;-webkit-transform:scale(1.03);transform:scale(1.03)}
.cartaorima:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}


/* ---- AS PEÇAS DO DESFILE DAS LETRAS ----
   ⚠️ LETRA GRANDE E EM BASTÃO. Foi o que a professora pediu nos comentários da
   folha de origem, e vale mais aqui do que em qualquer outro caderno: a criança
   está aprendendo a FORMA da letra. Letra pequena vira mancha. */
.ltbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.ltg{font-size:clamp(38px,11vw,62px);font-weight:900;color:#6d5ae6;line-height:1;
  letter-spacing:1px;font-family:Arial,Helvetica,sans-serif}
.ltbox.grandona .ltg{font-size:clamp(46px,13vw,76px)}
.ltop{font-size:clamp(26px,7vw,40px);font-weight:900;color:var(--texto2);line-height:1.05;
  letter-spacing:1px;font-family:Arial,Helvetica,sans-serif}
.ltop.grande{font-size:clamp(30px,8vw,46px);color:#6d5ae6}
.op.figbt .ltop{margin:2px 0}

/* folha 1 — o desfile: a fila que se percorre com o dedo */
.desfile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.ltdesf{min-width:62px;min-height:64px;border:3px solid #d9ddf2;border-radius:16px;background:#fff;
  cursor:pointer;-webkit-transition:background .2s,border-color .2s,transform .15s;
  transition:background .2s,border-color .2s,transform .15s}
.ltdesf.aceso{border-color:#1f9d55;background:#eafaf0}
.ltdesf.aceso .ltop{color:#1f9d55}
.ltdesf:active{-webkit-transform:scale(.94);transform:scale(.94)}

/* folhas 4, 5 e 6 — a letra e as vagas dos lados */
.vizinha{display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,16px);
  flex-wrap:nowrap;margin:4px 0 10px}
/* ⚠️ A SETA É DESENHADA EM CSS, não é o caractere "→". Regra do Marcos: nada de
   emoji nem SVG, porque não aparecem em alguns navegadores da escola — e a seta
   Unicode é exatamente esse caso (vira quadradinho no PC antigo). Aqui ela é uma
   haste com uma ponta feita de borda: aparece em qualquer navegador. */
.vizinha .setacss{position:relative;display:inline-block;width:34px;height:4px;flex:none;
  background:#9aa0c4;border-radius:2px;margin:0 2px}
.vizinha .setacss:after{content:"";position:absolute;right:-2px;top:-6px;
  width:0;height:0;border-left:12px solid #9aa0c4;
  border-top:8px solid transparent;border-bottom:8px solid transparent}
.vaga{min-width:62px;min-height:64px;display:flex;align-items:center;justify-content:center;
  border:3px dashed #c9cdec;border-radius:16px;background:#fff;
  font-size:clamp(26px,7vw,40px);font-weight:900;color:#9aa0c4;
  font-family:Arial,Helvetica,sans-serif;letter-spacing:1px}
.vaga.ok{border-style:solid;border-color:#1f9d55;background:#eafaf0;color:#1f9d55}

/* folha 7 — a trilha onde as letras entram em ordem */
.trilhalt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 10px}
.op.figbt.usada{opacity:.35;pointer-events:none}

/* folha 8 — a fila com o intruso: uma linha só, para a ordem ficar visível */
.gradecirc.filaerr{grid-template-columns:repeat(4,1fr)}
.figcirc.erro{border-color:#e2574c;background:#fdeceb}

/* folha 10 — o cartão do alfabeto da turma */
.cartaorima.cartalt{flex-direction:column;gap:2px;min-height:132px;min-width:104px}

/* a capa: as letras desfilando */
.capa .ltcapa{display:inline-block;font-size:clamp(30px,8vw,52px);font-weight:900;color:#6d5ae6;
  letter-spacing:2px;font-family:Arial,Helvetica,sans-serif;
  text-shadow:0 3px 0 #e6e2fb,0 5px 10px rgba(80,60,180,.18);
  -webkit-animation:entraDupla .55s cubic-bezier(.3,1.4,.5,1) both;
  animation:entraDupla .55s cubic-bezier(.3,1.4,.5,1) both}
@media (prefers-reduced-motion:reduce){
  .capa .ltcapa{-webkit-animation:none!important;animation:none!important;opacity:1!important}
}

.item{margin:12px 14px;padding:14px;border:2px solid #eceefa;border-radius:20px;background:#fbfbff}
.item.feito{border-color:#bfe6ce;background:#f3fcf6}
.item .n{font-weight:900;color:#9aa0bd;font-size:15px;margin-right:8px}
/* ⚠️ A FIGURA TEM ALTURA FIXA, E ISSO NÃO É ENFEITE (set/2026). Antes era
   `height:auto`: cada figura entrava no seu tamanho natural — a casa com 230 px
   e a bola com 90 — e, como `display:block` ignora o `text-align:center` do pai,
   todas encostavam na ESQUERDA. O item ficava com um buraco branco do lado
   direito e as folhas, desiguais. Altura igual + `margin:auto` resolve as duas
   coisas de uma vez: peso visual igual e figura no meio. */
.fig{display:block;width:auto;height:clamp(76px,19vw,116px);max-width:100%;
  margin:2px auto 6px;object-fit:contain;image-rendering:auto}
.figbt{border:0;background:none;padding:4px;border-radius:16px;min-width:48px;min-height:48px}
/* ⚠️ O ALTO-FALANTE É DESENHADO EM CSS — caixinha + triângulo + duas ondas de
   borda arredondada. Nada de emoji (vira quadradinho nos PCs da escola) e nada
   de SVG (ordem do Marcos, set/2026). */
.som{position:relative;width:46px;height:46px;min-width:46px;border:3px solid #6d5ae6;
  border-radius:50%;background:#f2efff;padding:0;cursor:pointer;flex:none}
.som:active{-webkit-transform:scale(.93);transform:scale(.93)}
.som .cone{position:absolute;left:12px;top:17px;width:7px;height:10px;background:#4b3fb0;
  border-radius:2px 0 0 2px}
.som .cone:after{content:"";position:absolute;left:6px;top:-6px;width:0;height:0;
  border-top:11px solid transparent;border-bottom:11px solid transparent;
  border-right:11px solid #4b3fb0}
.som .onda{position:absolute;border:3px solid #4b3fb0;border-left-color:transparent;
  border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
.som .o1{left:26px;top:16px;width:8px;height:12px}
.som .o2{left:29px;top:11px;width:13px;height:22px;opacity:.65}
.enunlin{display:flex;align-items:center;gap:10px;margin:0 2px}
.enunlin .enun{flex:1;min-width:0}
.palin{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.pal{font-weight:900;letter-spacing:2px;font-size:clamp(22px,6vw,34px);color:var(--texto)}

/* fileira genérica de opções */
.ops{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.op{min-width:64px;min-height:56px;border:3px solid #d9ddf2;border-radius:16px;background:#fff;color:var(--texto);
  font-weight:900;font-size:22px;padding:8px 14px;-webkit-transition:transform .1s;transition:transform .1s}
.op:active{transform:scale(.94)}
.op.certa{border-color:#15a34a;background:#e7f8ee;color:#0d7736}
.op.erro{border-color:#e0562f;background:#fdeee9;-webkit-animation:treme .4s;animation:treme .4s}
@-webkit-keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* o estojo de canetinhas da folha 5 */
.estojo{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.estojo .rot{font-weight:800;color:#5b4fc4;font-size:14px}
.lapis{width:44px;height:44px;border:4px solid #fff;border-radius:50%;padding:0;cursor:pointer;
  box-shadow:0 2px 8px rgba(35,25,80,.22);-webkit-transition:transform .12s;transition:transform .12s}
.lapis.esc{-webkit-transform:scale(1.18);transform:scale(1.18);box-shadow:0 0 0 4px rgba(60,50,120,.28)}
.op.pinta{-webkit-transition:background .18s,border-color .18s,color .18s;
  transition:background .18s,border-color .18s,color .18s}
.op.fig{padding:6px;min-width:96px}
.op.fig img{width:88px;height:88px;object-fit:contain;display:block}

/* 1 — a letra escondida */
.escondida{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.escondida .lt{font-weight:900;font-size:clamp(26px,7vw,40px);letter-spacing:2px}
.escondida .buraco{width:52px;height:56px;border-bottom:5px solid #6d5ae6;display:inline-flex;align-items:center;
  justify-content:center;background:#f2efff;border-radius:10px 10px 0 0;font-weight:900;font-size:34px;color:#6d5ae6}
/* a fila do alfabeto usa o mesmo visual da letra escondida */
.filalfa{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.filalfa .lt{font-weight:900;font-size:clamp(26px,7vw,40px);letter-spacing:2px;color:var(--texto3)}
.filalfa .buraco{width:52px;height:56px;border-bottom:5px solid #6d5ae6;display:inline-flex;
  align-items:center;justify-content:center;background:#f2efff;border-radius:10px 10px 0 0;
  font-weight:900;font-size:34px;color:#6d5ae6}
.filalfa .buraco.ok{background:#e7f8ee;border-color:#15a34a;color:#0d7736}
.filalfa .buraco.indo{color:transparent}
.filalfa.completa .lt,.filalfa.completa .buraco{-webkit-animation:pulo .42s ease;animation:pulo .42s ease}
.escondida .buraco.ok{background:#e7f8ee;border-color:#15a34a;color:#0d7736}
.escondida .buraco.perto,.filalfa .buraco.perto{background:#e7f8ee;border-color:#15a34a;
  -webkit-transform:scale(1.12);transform:scale(1.12)}

  transition:transform .5s cubic-bezier(.2,.9,.25,1);box-shadow:0 8px 20px rgba(21,163,74,.35)}
@-webkit-keyframes pulo{0%{-webkit-transform:translateY(0)}40%{-webkit-transform:translateY(-9px)}100%{-webkit-transform:translateY(0)}}

.escondida.completa .lt:nth-child(2),.escondida.completa .buraco:nth-child(2){-webkit-animation-delay:.06s;animation-delay:.06s}

@media (prefers-reduced-motion: reduce){

}

/* 6 · 10 — ligar e colar */
/* ⚠️ AS DUAS COLUNAS TÊM QUE TER A MESMA CAIXA (pedido do Marcos, set/2026:
   *"deixe os retângulos das sílabas iguais ao retângulo que estão os desenhos
   dentro, para ficar proporcional, igual e não ficar feio"*). Antes a caixa era
   `min-height`: a da esquerda crescia com a figura de 64px e a da direita ficava

.ligar{position:relative;display:flex;gap:clamp(30px,10vw,96px);justify-content:space-between;margin:14px 6px}

/* ================= A CAPA =================
   Pedido do Marcos (set/2026): *"essas atividades deveriam ter uma capa bem
   legal e bonita"*. O tema sai do próprio nome — uma FÁBRICA de palavras:
   telhado de fábrica, letras que entram uma a uma como se saíssem da linha de
   montagem, e a esteira embaixo carregando as figuras das folhas.
   Feita só com CSS e PNG: nada de SVG, nada de emoji (regra dele). */
.capa{position:relative;text-align:center;padding:18px 16px 24px;overflow:hidden;
  background:-webkit-linear-gradient(top,#efe9ff 0%,#fdf6ff 58%,#fff 100%);
  background:linear-gradient(180deg,#efe9ff 0%,#fdf6ff 58%,#fff 100%)}
.capa .ceu{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden}
/* bolhas de luz ao fundo — dão profundidade sem competir com o título.
   ⚠️ Antes eram três retângulos brancos arredondados que, na tela, pareciam
   FALHA de desenho. Círculo suave da própria cor da capa lê como fundo. */
.capa .nv{position:absolute;display:block;border-radius:50%;
  background:-webkit-radial-gradient(circle,rgba(124,102,255,.20),rgba(124,102,255,0) 70%);
  background:radial-gradient(circle,rgba(124,102,255,.20),rgba(124,102,255,0) 70%)}
.capa .n1{width:240px;height:240px;left:-60px;top:-40px}
.capa .n2{width:300px;height:300px;right:-90px;top:10px}
.capa .n3{width:180px;height:180px;left:44%;bottom:-70px}
/* o telhadinho da fábrica com a inicial */
.capa .chapeu{position:relative;width:66px;height:66px;margin:14px auto 2px;border-radius:16px;
  background:-webkit-linear-gradient(top left,#7c66ff,#5b4fc4);
  background:linear-gradient(135deg,#7c66ff,#5b4fc4);color:#fff;font-weight:900;font-size:34px;
  line-height:66px;box-shadow:0 8px 18px rgba(91,79,196,.36)}
.capa .chapeu:before{content:"";position:absolute;left:-9px;right:-9px;top:-13px;height:0;
  border-left:42px solid transparent;border-right:42px solid transparent;border-bottom:16px solid #b0308f}
.capa h1.titu{margin:10px 0 4px;line-height:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.capa .titu .lt{display:inline-block;font-size:clamp(24px,6.4vw,42px);font-weight:900;letter-spacing:0;
  color:#4b3fb0;text-shadow:0 3px 0 #d9d2ff,0 5px 10px rgba(60,40,140,.18);
  -webkit-animation:caiLetra .5s both;animation:caiLetra .5s both}
.capa .titu .esp{display:inline-block;width:14px}
/* ⚠️ `caiLetra` e não `cai`: o confete JÁ tinha um `@keyframes cai` que
   termina em `opacity:0`, declarado mais abaixo — e ele vencia. As letras
   do título animavam para invisível e a capa aparecia sem título nenhum.
   Nome de keyframe é global: conferir antes de criar um. */
@-webkit-keyframes caiLetra{from{opacity:0;-webkit-transform:translateY(-26px) rotate(-8deg)}to{opacity:1;-webkit-transform:none}}
@keyframes caiLetra{from{opacity:0;transform:translateY(-26px) rotate(-8deg)}to{opacity:1;transform:none}}
.capa .sub{font-weight:700;color:#5b4fc4;font-size:clamp(13px,3.6vw,18px);margin:6px 0 4px}
/* a esteira: as figuras em cima, a cinta rodando embaixo */
.capa .esteira{max-width:660px;margin:16px auto 4px;position:relative}
/* ---- as duplas da capa: rima é coisa de DOIS, então os pares entram juntos ----
   ⚠️ sem `white-space:nowrap` no par, o navegador quebra entre a figura e o
   sinal de igual e a dupla deixa de se ler como dupla. */
.capa .dupla{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  -webkit-animation:entraDupla .6s cubic-bezier(.3,1.4,.5,1) both;
  animation:entraDupla .6s cubic-bezier(.3,1.4,.5,1) both}
.capa .dupla .fig{height:clamp(54px,13vw,86px)}
.capa .igual{display:inline-block;width:16px;height:12px;flex:none;
  border-top:3px solid #6d5ae6;border-bottom:3px solid #6d5ae6}
@-webkit-keyframes entraDupla{from{opacity:0;-webkit-transform:translateY(-18px) scale(.85)}to{opacity:1;-webkit-transform:none}}
@keyframes entraDupla{from{opacity:0;transform:translateY(-18px) scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.capa .dupla{-webkit-animation:none!important;animation:none!important;opacity:1!important;-webkit-transform:none!important;transform:none!important}}
.capa .cena{display:flex;justify-content:center;align-items:flex-end;gap:8px;flex-wrap:nowrap}
.capa .cena img{width:clamp(54px,14vw,110px);height:clamp(54px,14vw,110px);object-fit:contain;
  -webkit-animation:sobe 2.6s ease-in-out infinite;animation:sobe 2.6s ease-in-out infinite}
.capa .cena img:nth-child(2){-webkit-animation-delay:.35s;animation-delay:.35s}
.capa .cena img:nth-child(3){-webkit-animation-delay:.7s;animation-delay:.7s}

.capa .cena img:nth-child(5){-webkit-animation-delay:1.4s;animation-delay:1.4s}
@-webkit-keyframes sobe{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-7px)}}
@keyframes sobe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.capa .cinta{display:flex;gap:6px;justify-content:center;background:#3b3560;border-radius:9px;
  padding:6px 8px;margin-top:6px;box-shadow:0 6px 14px rgba(35,25,80,.22)}

@media (prefers-reduced-motion: reduce){
  .capa .titu .lt,.capa .cena img{-webkit-animation:none;animation:none}
}

/* ⚠️ SEM EMOJI E SEM SVG (ordem do Marcos, set/2026: *"evite usar svg e
   emojis pois não aparecem em alguns navegadores"*). Nos PCs da escola o
   emoji vira quadradinho vazio e a criança de seis anos não sabe o que é um
   quadradinho. Aqui: troféu e estrelas são PNG de argila (do banco), as
   setas são triângulos de CSS puro e o resto é palavra escrita. */
#medalha{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe680,#e0a800);
  margin:14px auto;display:flex;align-items:center;justify-content:center;

/* se a figura do troféu faltar, o disco ainda é um disco de ouro com a
   palavra — nunca um quadradinho quebrado. */
#medalha.semfig:after{content:"BOA!";font-weight:900;font-size:26px;color:#7a5600}
.seta{display:inline-block;width:0;height:0;vertical-align:middle;
  border-top:8px solid transparent;border-bottom:8px solid transparent}

#estrelas img{width:52px;height:52px;object-fit:contain;display:inline-block;margin:0 3px;vertical-align:middle}

/* ---- o parecer descritivo e a nota (relatório do PROFESSOR) ----
   ⚠️ A NOTA GRANDE fica aqui e SÓ aqui. Na tela da criança nunca aparece
   número: ela vê estrelas e barras. Ver o comentário em `folhas.js`. */
#relatorio .parecer{margin:10px 0 4px;padding:10px 12px;border-left:5px solid #6d5ae6;

/* =========================================================================
   ANIMAÇÃO DAS FOLHAS (pedido do Marcos, set/2026: *"consegue deixar as
   páginas mais animadas e atraentes?"*)

   ⚠️ E A REGRA QUE MANDA AQUI É A REGRA 2 DA PESQUISA: NADA ANIMA SEM FUNÇÃO.
   Movimento por movimento cansa a criança de seis anos e ainda pesa no PC da
   escola. Cada animação daqui faz um trabalho:
     · os itens ENTRAM EM CASCATA → a criança vê que a folha tem começo e ordem,
       e o olho dela é levado ao item 1 em vez de cair no meio da tela;
     · a faixa do título DESLIZA → marca a troca de folha (transição entre telas,
       que é justamente o que falta no padrão "empresa grande");
     · o acerto DÁ UM PULINHO e a opção certa BRILHA → resposta tátil, o gesto
       que confirma sem precisar de texto;
     · o erro BALANÇA de leve → diz "de novo" sem dizer "errou".
   `prefers-reduced-motion` desliga tudo e a folha continua inteira.
   ========================================================================= */
.pagina.viva .item{-webkit-animation:entraItem .42s ease-out both;animation:entraItem .42s ease-out both}
.pagina.viva .item:nth-child(2){-webkit-animation-delay:.05s;animation-delay:.05s}
.pagina.viva .item:nth-child(3){-webkit-animation-delay:.10s;animation-delay:.10s}
.pagina.viva .item:nth-child(4){-webkit-animation-delay:.15s;animation-delay:.15s}
.pagina.viva .item:nth-child(5){-webkit-animation-delay:.20s;animation-delay:.20s}
.pagina.viva .item:nth-child(6){-webkit-animation-delay:.25s;animation-delay:.25s}
.pagina.viva .item:nth-child(n+7){-webkit-animation-delay:.30s;animation-delay:.30s}
@-webkit-keyframes entraItem{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}

.pagina.viva .faixa{-webkit-animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both;
  animation:deslizaFaixa .4s cubic-bezier(.2,.9,.3,1) both}
@-webkit-keyframes deslizaFaixa{from{opacity:0;-webkit-transform:translateX(-22px)}to{opacity:1;-webkit-transform:none}}
@keyframes deslizaFaixa{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* o acerto: um pulinho curto e um brilho que corre pela opção certa */
.op.certa,.figcirc.marcada,.cartaorima.escolhido{
  -webkit-animation:pulinho .4s cubic-bezier(.3,1.6,.5,1);animation:pulinho .4s cubic-bezier(.3,1.6,.5,1)}
@-webkit-keyframes pulinho{0%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.09)}100%{-webkit-transform:scale(1)}}
@keyframes pulinho{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.op.certa{position:relative;overflow:hidden}
.op.certa::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:38%;pointer-events:none;
  background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  -webkit-transform:skewX(-18deg);transform:skewX(-18deg);
  -webkit-animation:brilhoOp .55s .1s ease-out;animation:brilhoOp .55s .1s ease-out}
@-webkit-keyframes brilhoOp{from{left:-40%}to{left:112%}}
@keyframes brilhoOp{from{left:-40%}to{left:112%}}

/* o erro: balança de leve — diz "de novo" sem dizer "errou" */
.op.erro{-webkit-animation:balanca .34s;animation:balanca .34s}
@-webkit-keyframes balanca{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes balanca{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* o item que fecha: some o contorno e entra o verde, sem susto */
.item{-webkit-transition:border-color .4s,background .4s;transition:border-color .4s,background .4s}

/* a figura responde ao toque — regra 1: o alvo reage ao PRESSIONAR */
.op.figbt:active,.figcirc:active,.cartaorima:active{-webkit-transform:scale(.96);transform:scale(.96)}

@media (prefers-reduced-motion:reduce){
  .pagina.viva .item,.pagina.viva .faixa,.op.certa,.op.erro,
  .figcirc.marcada,.cartaorima.escolhido{
    -webkit-animation:none!important;animation:none!important;opacity:1!important;
    -webkit-transform:none!important;transform:none!important}
  .op.certa::after{display:none}
}

    return;
  }
  falarNavegador(t); setTimeout(fim, Math.min(12000, 400 + t.length * 62));
}
/* ⭐⭐ A SÍLABA VEM DA PALAVRA (set/2026 — ordem do Marcos: *"a pronúncia das
   sílabas precisa ser precisa e melhorada, use alguma ferramenta profissional"*).

   `audio/so_sb_<palavra>_<i>.mp3` não foi sintetizado como fragmento solto: é um
   RECORTE do áudio em que a voz leu as sílabas daquela palavra, cortado nos
   marcadores de tempo que o próprio serviço devolve (ver
   `_padrao/silabas_voz.py`). Por isso "bo" de BOLA e "bo" de BOLO soam
   diferentes — como devem.

   Se o recorte não existir (atividade ainda sem gravar), cai para a fala de
   reserva `sb_<SÍLABA>`, que é o caminho antigo. Rede de segurança, não padrão. */
/* ⚠️⚠️ A SÍLABA SAI DE DENTRO DA PALAVRA — e a reserva NUNCA é a sílaba solta.
   Lição paga em set/2026: o Marcos ouviu o app dizer "vê-á" no lugar de "va".
   O recorte não existia (o `_padrao/silabas_voz.py` falhou calado no workflow) e
   a reserva era `falar("sb_" + silaba)` — ou seja, a sílaba SINTETIZADA solta.
   E ela sai errada por construção: a voz não lê som, lê PALAVRA; entregue "VA" e
   o serviço soletra. Numa atividade de consciência fonológica isso não é um
   arranhão: ensina a criança a dizer o NOME DA LETRA no lugar do som.
   Agora a reserva é a PALAVRA INTEIRA. Ouvir "vaca" é menos do que ouvir "va",
   mas está CERTO — e o portão `_qa/silabas.py` impede que se publique assim. */
function falarSilaba(palavra, i, silaba){
  if(!vozLigada) return;
  if(!palavra && silaba && SILMAP[silaba]){ palavra = SILMAP[silaba][0]; i = SILMAP[silaba][1]; }
  if(!palavra){ return; }
  calar();
  if(!_narr){ _narr = new Audio(); _narr.preload = "auto"; }
  _narr.onended = null;
  _narr.onerror = function(){ falar("pal_" + palavra); };
  _narr.src = "audio/so_sb_" + palavra + "_" + i + ".mp3";
  try{ _narr.currentTime = 0; }catch(e){}
  var pr = _narr.play(); if(pr && pr["catch"]) pr["catch"](function(){ falar("pal_" + palavra); });
}
function falarDepois(k, ms){ setTimeout(function(){ falar(k); }, ms || 0); }

/* ---------- utilidades ---------- */
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function salvar(){ try{ ST.quando = Date.now(); localStorage.setItem(CHAVE_LS, JSON.stringify(ST)); }catch(e){} }
function carregar(){ try{ var s = localStorage.getItem(CHAVE_LS); if(!s) return null; var o = JSON.parse(s); if(!o || !o.quando || Date.now() - o.quando > 55 * 60 * 1000 || !o.folha) return null; return o; }catch(e){ return null; } }
function tentativa(id, ok){ if(!ST.tent[id]) ST.tent[id] = {erros: 0, ok: false}; if(ok) ST.tent[id].ok = true; else ST.tent[id].erros++; salvar(); }
function rnd(n){ return Math.floor(Math.random() * n); }
function baralha(a){ var b = a.slice(), i, j, t; for(i = b.length - 1; i > 0; i--){ j = rnd(i + 1); t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function pega(pool, qtd){ return baralha(pool).slice(0, Math.min(qtd, pool.length)); }
function confete(n){
  var c = document.getElementById("confete"), cores = ["#6d5ae6", "#ffd233", "#15a34a", "#e0562f", "#1179bf"], i;
  for(i = 0; i < n; i++){
    (function(i){
      var d = el("div", "cf");
      d.style.left = rnd(100) + "%"; d.style.top = "-20px";
      d.style.background = cores[rnd(cores.length)];
      d.style.animationDelay = (i * 26) + "ms";
      c.appendChild(d); setTimeout(function(){ if(d.parentNode) c.removeChild(d); }, 1900 + i * 26);
    })(i);
  }
}

/* ---------- registro das respostas (o boletim e o relatório leem daqui) ---------- */
var RESP = {};   /* id -> {certo, pag} */
function registra(id, pag, certo){ RESP[id] = {certo: certo, pag: pag}; }
function acertou(id, fala){
  if(ST.resp[id]) return;
  tentativa(id, true); ST.resp[id] = 1; salvar(); sCerto();
  if(fala) falar(fala);
  setTimeout(function(){ confereFolha(RESP[id].pag); }, 850);
}
function errou(id, dica){
  tentativa(id, false); sErro();
  falar(ST.tent[id].erros >= 2 && dica ? dica : "quase");
}

/* ---------- sorteio da folha ---------- */
function novaFolha(){
  return {
    p1: pega(ITENS.p1, 8), p2: pega(ITENS.p2, 10), p3: pega(ITENS.p3, 8),
    p4: pega(ITENS.p4, 6), p5: pega(ITENS.p5, 8), p6: pega(ITENS.p6, 10),
    /* ⚠️ a folha 7 vai INTEIRA: as três gavetas precisam de quatro figuras
       cada uma, e sortear um subconjunto deixaria gaveta vazia */
    p7: ITENS.p7.slice(0), p8: pega(ITENS.p8, 6), p9: pega(ITENS.p9, 8),
    p10: pega(ITENS.p10, 10)
  };
}
